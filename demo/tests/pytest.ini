[pytest]
# Pytest configuration for MAF project

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for different test types
markers =
    asyncio: mark test as async (deselect with '-m "not asyncio"')
    slow: mark test as slow (deselect with '-m "not slow"')
    integration: mark test as integration test
    unit: mark test as unit test
    concurrency: mark test as concurrency test

# Async asyncio mode
asyncio_mode = auto

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:cacheprovider
    --capture=no

# Timeout for tests (prevent hanging)
timeout = 30

# Minimum Python version
minversion = 3.8

# Coverage options (if using pytest-cov)
# --cov=. --cov-report=html --cov-report=term

testpaths = demo

# Ignore patterns
norecursedirs = .git .venv __pycache__ *.egg-info .pytest_cache
